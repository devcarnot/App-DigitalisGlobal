# Build the macOS .dmg on Apple's runners (cannot run on Windows — see electron-builder docs).
name: Build macOS desktop app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-mac.yml'

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        run: npm run desktop:install

      - name: Prepare desktop icons
        run: node scripts/prepare-desktop-icons.js

      - name: Build unsigned universal DMG (Intel + Apple Silicon)
        run: npm run desktop:dist:mac
        env:
          # No Apple Developer cert in CI — users may need Right-click → Open the first time.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # GitHub macos-latest is arm64; universal merges x64 + arm64 for 2019 Intel MacBook Pro, etc.

      - name: Verify DMG was built
        run: test -f desktop/release/digitalis-workspace-setup.dmg

      # Artifact storage quota is limited on GitHub Free; only upload on manual runs.
      - name: Upload DMG artifact
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: digitalis-workspace-setup-dmg
          path: desktop/release/digitalis-workspace-setup.dmg
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
